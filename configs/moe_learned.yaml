include: base.yaml

experiment:
  condition_id: moe_learned
  name: BabyMoE learned top-2 router
  description: Four-expert Mixtral-family causal LM trained from scratch.

model:
  family: mixtral
  # Two active 1024-wide SwiGLU experts match one 2048-wide dense SwiGLU FFN.
  intermediate_size: 1024
  num_local_experts: 4
  num_experts_per_tok: 2
  router_aux_loss_coef: 0.001
  router_jitter_noise: 0.0
  router_mode: learned

routing:
  enabled: true
